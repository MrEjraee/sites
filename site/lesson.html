<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body class="lesson">

<div class="topbar">
  <a class="home" href="index.html">&larr; All lessons</a>
  <span class="sep">/</span>
  <div class="title" id="lessonTitle">Lesson</div>
  <span class="chip" id="saveChip">Not saved yet</span>
  <button class="btn-ghost no-print" id="pdfBtn">PDF</button>
</div>

<div class="tracker" id="tracker" aria-hidden="true"></div>
<div class="trackmeta">
  <span id="stepCount">Step 1</span>
  <span class="now-label" id="stageName"></span>
</div>

<div class="brief">
  <p class="eyebrow" id="briefEyebrow">Your task</p>
  <h2 id="briefTitle"></h2>
  <p id="briefText"></p>
</div>

<div class="stage" id="stage">
  <div class="banner" id="signinBanner" hidden>
    You're not signed in, so your work <b>will not save</b>.
    <a href="index.html">Sign in on the home page</a>, then come back.
  </div>
  <div id="blocks"></div>
</div>

<div class="dock">
  <button class="btn-ghost" id="backBtn">&larr; Back</button>
  <div class="mid">
    <p class="lockmsg" id="lockMsg" aria-live="polite"></p>
  </div>
  <span id="bypassDot" role="button" tabindex="0" aria-label="Teacher options">&#183;</span>
  <button class="btn-primary btn-continue" id="nextBtn">Continue &rarr;</button>
</div>

<script>
const API = (window.HUB && window.HUB.WORKER_URL) || "";
const token = localStorage.getItem("hub_token") || "";
const $ = (id) => document.getElementById(id);
const lessonId = new URLSearchParams(location.search).get("id") || "demo";

const fields = {};   // id -> { get, set }
const steps  = [];   // { section, check(), brief:{eyebrow,title,text} }
let step = 0, bypassed = false, lesson = null;

if (!token) $("signinBanner").hidden = false;

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function setChip(state){
  const c = $("saveChip");
  c.dataset.state = state;
  c.textContent = state==="saved" ? "Saved" : state==="saving" ? "Saving" : state==="error" ? "Not saved" : "Not saved";
}
function strHash(s){ let x = 5381; for (const c of s) x = ((x << 5) + x + c.charCodeAt(0)) >>> 0; return x; }
function normLetters(s){ return (s || "").toUpperCase().replace(/[^A-Z]/g, ""); }
function wordCount(s){ return (s || "").trim().split(/\s+/).filter(Boolean).length; }
function stripTags(s){ return String(s || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim(); }

/* ---------- autosave: debounced, deduplicated ---------- */
const AUTOSAVE_DELAY = 2500, MIN_GAP = 6000;
let saveTimer = null, lastSent = "", lastSaveAt = 0, saving = false;

function snapshot(){
  const data = { __step: step };
  Object.entries(fields).forEach(([id, f]) => { data[id] = f.get(); });
  return data;
}
function markDirty(){
  refreshGate();
  if (JSON.stringify(snapshot()) === lastSent) return;
  setChip("");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, Math.max(AUTOSAVE_DELAY, MIN_GAP - (Date.now() - lastSaveAt)));
}
async function save(){
  if (saving || !token || !API || API.indexOf("PASTE_") === 0) return;
  const payload = JSON.stringify(snapshot());
  if (payload === lastSent) return;
  saving = true; setChip("saving");
  try{
    const r = await fetch(API + "/api/save", {
      method:"POST",
      headers:{ "Content-Type":"application/json", Authorization:"Bearer " + token },
      body: JSON.stringify({ lesson: lessonId, data: JSON.parse(payload) })
    });
    if (!r.ok) throw new Error("save failed");
    lastSent = payload; lastSaveAt = Date.now(); setChip("saved");
  }catch(e){ setChip("error"); }
  saving = false;
}
window.addEventListener("pagehide", () => { clearTimeout(saveTimer); save(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });

/* ---------- load ---------- */
fetch("lessons/" + encodeURIComponent(lessonId) + ".json")
  .then(r => { if (!r.ok) throw new Error("missing"); return r.json().catch(() => { throw new Error("badjson"); }); })
  .then(async (l) => {
    lesson = l;
    document.title = l.title;
    $("lessonTitle").textContent = l.title;
    l.blocks.forEach(renderBlock);
    buildTracker();
    if (token && API && API.indexOf("PASTE_")!==0) await loadSaved();
    showStep(step);
  })
  .catch((e) => {
    $("blocks").innerHTML = '<section class="station"><p class="err">' + (
      e.message === "missing" ? "Could not find this lesson. Check the lesson id in the address bar."
      : e.message === "badjson" ? "This lesson file has a typo in it and could not be read."
      : "Something went wrong displaying this lesson. Please tell your teacher.") + '</p></section>';
    $("briefTitle").textContent = "This lesson could not open";
    $("nextBtn").disabled = true;
  });

async function loadSaved(){
  try{
    const r = await fetch(API + "/api/work?lesson=" + encodeURIComponent(lessonId), { headers: { Authorization: "Bearer " + token } });
    const d = await r.json();
    if (r.ok && d.data){
      Object.entries(d.data).forEach(([id, val]) => { if (fields[id]) fields[id].set(val); });
      if (typeof d.data.__step === "number") step = Math.min(Math.max(d.data.__step, 0), steps.length - 1);
      lastSent = JSON.stringify(snapshot());
      setChip("saved");
    }
  }catch(e){ /* offline — work continues locally */ }
}

/* ---------- shell ---------- */
function buildTracker(){
  const t = $("tracker"); t.innerHTML = "";
  steps.forEach(() => t.appendChild(el("div","seg")));
}
function showStep(i){
  step = Math.min(Math.max(i, 0), steps.length - 1);
  steps.forEach((s, n) => { s.section.hidden = (n !== step); });

  Array.from($("tracker").children).forEach((seg, n) => {
    seg.className = "seg" + (n < step ? " done" : n === step ? " now" : "");
  });

  const b = steps[step].brief;
  $("briefEyebrow").textContent = b.eyebrow || "Your task";
  $("briefTitle").textContent = b.title || "";
  $("briefText").textContent = b.text || "";
  $("briefText").hidden = !b.text;

  $("stepCount").textContent = "Step " + (step + 1) + " of " + steps.length;
  $("stageName").textContent = step === steps.length - 1 ? "Final step" : "";
  $("backBtn").disabled = step === 0;
  $("nextBtn").textContent = step === steps.length - 1 ? "Finish 🏁" : "Continue →";
  $("stage").scrollTop = 0;
  refreshGate();
}
function refreshGate(){
  const s = steps[step];
  if (!s) return;
  const res = bypassed ? { ok:true } : s.check();
  $("nextBtn").disabled = !res.ok;
  $("lockMsg").textContent = res.ok ? "" : (res.message || "Finish this activity to continue.");
  $("lockMsg").hidden = res.ok;
}
$("backBtn").addEventListener("click", () => showStep(step - 1));
$("nextBtn").addEventListener("click", () => {
  if (step === steps.length - 1){
    save();
    $("briefEyebrow").textContent = "Complete";
    $("briefTitle").textContent = "Lesson finished. Well done.";
    $("briefText").textContent = "Your work is saved. You can use Back to look over anything again.";
    $("nextBtn").disabled = true;
    return;
  }
  showStep(step + 1);
});

/* ---------- bypass ---------- */
$("bypassDot").addEventListener("click", askBypass);
$("bypassDot").addEventListener("keydown", (e) => { if (e.key === "Enter") askBypass(); });
function askBypass(){
  const code = prompt("Enter code:");
  if (code === null) return;
  const wanted = (lesson && lesson.bypassHash) || 2667650483; // default: SKIP-2026
  if (strHash(code.trim()) === wanted){
    bypassed = true;
    document.body.classList.add("bypassed");
    refreshGate();
  } else {
    alert("That code is not right.");
  }
}

/* ---------- renderers: { section, check, brief } ---------- */
function renderBlock(b, i){
  const R = { text:rText, question:rQuestion, python:rPython, embed:rEmbed, link:rLink,
              quiz:rQuiz, password:rPassword, caesar:rCaesar }[b.type];
  if (!R){ console.warn("Unknown block type:", b.type); return; }
  let built;
  try { built = R(b); }
  catch (err){
    console.error("Block " + (i+1) + " (" + b.type + ") failed:", err);
    const s = el("section","station");
    s.appendChild(el("p","err","This activity could not be displayed. Continue and tell your teacher."));
    built = { section:s, check:() => ({ ok:true }), brief:{ eyebrow:"Notice", title:"Activity unavailable", text:"" } };
  }
  built.section.hidden = true;
  $("blocks").appendChild(built.section);
  steps.push(built);
}

/* text: the html is the content; the brief carries the heading */
function rText(b){
  const s = el("section");
  const div = el("div","prose", b.html);
  const h = div.querySelector("h2");
  const title = h ? h.textContent : "Read this";
  if (h) h.remove();
  s.appendChild(div);
  return { section:s, check:() => ({ ok:true }),
           brief:{ eyebrow:"Read", title, text:"Read the page, then press Continue." } };
}

function rEmbed(b){
  const s = el("section");
  const f = el("iframe","embed"); f.src = b.url; f.setAttribute("allowfullscreen","");
  f.title = b.title || "Video";
  s.appendChild(f);
  const done = el("label","confirm");
  const cb = el("input"); cb.type = "checkbox";
  cb.addEventListener("change", markDirty);
  done.appendChild(cb); done.appendChild(el("span","","I have watched the whole video"));
  s.appendChild(done);
  if (b.id) fields[b.id] = { get:() => cb.checked, set:(v) => { cb.checked = !!v; } };
  return { section:s,
           check:() => cb.checked ? { ok:true } : { ok:false, message:"Tick the box once you have watched it" },
           brief:{ eyebrow:"Watch", title:stripTags(b.title) || "Watch the video", text:b.note || "Headphones on. Watch it all, then tick the box below." } };
}

function rQuestion(b){
  const s = el("section");
  const min = b.minWords || 8;
  const ta = el("textarea","answer"); ta.rows = 6; ta.placeholder = "Type your answer here…";
  const counter = el("p","counter");
  function tick(){
    const n = wordCount(ta.value);
    counter.textContent = n + " word" + (n===1?"":"s") + (n < min ? " · write at least " + min : " · long enough ✓");
    counter.dataset.ok = n >= min;
  }
  ta.addEventListener("input", () => { tick(); markDirty(); });
  fields[b.id] = { get:() => ta.value, set:(v) => { ta.value = v || ""; tick(); } };
  s.appendChild(ta); s.appendChild(counter); tick();
  return { section:s,
           check:() => wordCount(ta.value) >= min ? { ok:true } : { ok:false, message:"Write at least " + min + " words" },
           brief:{ eyebrow:"Answer", title:"Write your answer", text:stripTags(b.prompt) } };
}

function rLink(b){
  const s = el("section");
  const inp = el("input"); inp.type = "text"; inp.placeholder = "https://…";
  inp.addEventListener("input", markDirty);
  fields[b.id] = { get:() => inp.value, set:(v) => { inp.value = v || ""; } };
  s.appendChild(inp);
  if (b.note) s.appendChild(el("p","hint", b.note));
  return { section:s,
           check:() => /^https?:\/\/\S+\.\S+/.test(inp.value.trim()) ? { ok:true } : { ok:false, message:"Paste a link starting with https://" },
           brief:{ eyebrow:"Hand in", title:stripTags(b.prompt) || "Paste your link", text:"" } };
}

function rPython(b){
  const s = el("section");
  const ta = el("textarea","code"); ta.spellcheck = false; ta.value = b.starter || "";
  ta.addEventListener("input", markDirty);
  fields[b.id] = { get:() => ta.value, set:(v) => { if (v) ta.value = v; } };
  s.appendChild(ta);
  const row = el("div","row no-print"); row.style.marginTop = "14px";
  const run = el("button","btn-primary","Run"); const err = el("span","err");
  const out = el("div","output"); out.setAttribute("aria-live","polite");
  let ran = false;
  run.addEventListener("click", async () => { await runPython(ta.value, out, err); ran = true; markDirty(); });
  row.appendChild(run); row.appendChild(err);
  s.appendChild(row); s.appendChild(out);
  return { section:s,
           check:() => ran ? { ok:true } : { ok:false, message:"Press Run at least once" },
           brief:{ eyebrow:"Code", title:"Python", text:b.task || "Read the code, run it, then change it." } };
}

/* ---- QUIZ: one question at a time, instant marking, retry on wrong ---- */
function rQuiz(b){
  const s = el("section");
  const head = el("p","qhead");
  const qtext = el("p","qtext");
  const opts = el("div","opts");
  const fb = el("div","feedback"); fb.hidden = true;
  const row = el("div","row no-print"); row.style.marginTop = "18px";
  const btn = el("button","btn-primary","Check answer");
  row.appendChild(btn);
  s.appendChild(head); s.appendChild(qtext); s.appendChild(opts); s.appendChild(fb); s.appendChild(row);

  const n = b.questions.length;
  const chosen = new Array(n).fill(null);
  const solved = new Array(n).fill(false);
  let qi = 0;

  function draw(){
    const q = b.questions[qi];
    head.textContent = "Question " + (qi+1) + " of " + n;
    qtext.innerHTML = q.q;
    opts.innerHTML = "";
    q.options.forEach((text, j) => {
      const lab = el("label","opt");
      const radio = el("input"); radio.type = "radio"; radio.name = b.id + "-q" + qi;
      radio.checked = chosen[qi] === j;
      if (chosen[qi] === j) lab.classList.add("chosen");
      radio.addEventListener("change", () => {
        chosen[qi] = j;
        Array.from(opts.children).forEach((c, k) => c.classList.toggle("chosen", k === j));
        fb.hidden = true;
        markDirty();
      });
      lab.appendChild(radio); lab.appendChild(el("span","", text));
      opts.appendChild(lab);
    });
    fb.hidden = true;
    btn.textContent = "Check answer";
    if (solved[qi]) reveal(true, false);
  }
  function reveal(ok, animate){
    const q = b.questions[qi];
    Array.from(opts.children).forEach((c, k) => {
      c.classList.toggle("right", ok && k === chosen[qi]);
      c.classList.toggle("wrong", !ok && k === chosen[qi]);
    });
    fb.hidden = false;
    fb.dataset.verdict = ok ? "correct" : "incorrect";
    fb.innerHTML = "<b></b><span></span>";
    fb.querySelector("b").textContent = ok ? "Correct" : "Not quite — try another answer";
    fb.querySelector("span").textContent = ok ? (q.why || "") : (q.hint || "Read the question again and pick a different answer.");
    if (ok && qi < n - 1) btn.textContent = "Next question →";
    else if (ok) btn.textContent = "All done ✓";
  }
  btn.addEventListener("click", () => {
    if (solved[qi] && qi < n - 1){ qi++; draw(); return; }
    if (solved[qi]) return;
    if (chosen[qi] === null){ fb.hidden = false; fb.dataset.verdict = "incorrect"; fb.innerHTML = "<b>Choose an answer</b><span>Pick one of the options above, then check it.</span>"; return; }
    const ok = chosen[qi] === b.questions[qi].answer;
    solved[qi] = solved[qi] || ok;
    reveal(ok, true);
    markDirty();
  });

  fields[b.id] = {
    get: () => ({ chosen, solved, score: solved.filter(Boolean).length, outOf: n }),
    set: (v) => {
      if (!v || !Array.isArray(v.chosen)) return;
      v.chosen.forEach((c, i) => { if (c !== null && c !== undefined) chosen[i] = c; });
      if (Array.isArray(v.solved)) v.solved.forEach((x, i) => { solved[i] = !!x; });
      qi = solved.findIndex(x => !x); if (qi === -1) qi = n - 1;
      draw();
    }
  };
  draw();
  return { section:s,
           check:() => solved.every(Boolean) ? { ok:true } : { ok:false, message:"Answer all " + n + " questions correctly (" + solved.filter(Boolean).length + "/" + n + ")" },
           brief:{ eyebrow:"Quiz", title:stripTags(b.title) || "Quiz", text:b.note || "Choose an answer, then press Check answer. If it's wrong you can try again." } };
}

/* ---- PASSWORD: nothing typed here is saved or sent ---- */
const COMMON_PW = ["password","123456","12345678","qwerty","abc123","letmein","monkey","football","iloveyou","admin","welcome","dragon","sunshine","princess","password1","liverpool","arsenal","chelsea","minecraft","fortnite"];
function rPassword(b){
  const s = el("section");
  s.appendChild(el("p","warnline","🔒 Test made-up passwords only — never a real one. Nothing you type here is sent anywhere or saved."));
  const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.placeholder = "Try a password…";
  s.appendChild(inp);
  const meter = el("div","meter"); const bar = el("div","meter-bar"); meter.appendChild(bar); s.appendChild(meter);
  const verdict = el("div","pw-verdict"); s.appendChild(verdict);
  const checks = el("ul","pw-checks"); s.appendChild(checks);

  let best = 0;
  const rules = [
    { label:"At least 12 characters long", test:(p) => p.length >= 12 },
    { label:"Has capital letters and small letters", test:(p) => /[a-z]/.test(p) && /[A-Z]/.test(p) },
    { label:"Has at least one number", test:(p) => /[0-9]/.test(p) },
    { label:"Has a symbol, like ! ? # or £", test:(p) => /[^A-Za-z0-9]/.test(p) },
    { label:"Is not a common or guessable password", test:(p) => p.length > 0 && !COMMON_PW.some(c => p.toLowerCase().includes(c)) },
  ];
  function update(){
    const p = inp.value;
    const passed = rules.map(r => r.test(p));
    const k = passed.filter(Boolean).length;
    checks.innerHTML = "";
    rules.forEach((r, i) => {
      const li = el("li", passed[i] ? "pass" : "fail");
      li.textContent = (passed[i] ? "✓ " : "✗ ") + r.label;
      checks.appendChild(li);
    });
    bar.style.width = (p ? (k / rules.length) * 100 : 0) + "%";
    bar.dataset.level = k <= 2 ? "weak" : k <= 4 ? "ok" : "strong";
    verdict.textContent = !p ? "" : k <= 2 ? "Weak — a hacker's computer could guess this very quickly."
                        : k <= 4 ? "Getting better — keep going." : "Strong — well done!";
    if (k > best) best = k;
    markDirty();
  }
  inp.addEventListener("input", update);
  fields[b.id] = { get:() => ({ bestScore:best, outOf:rules.length }), set:(v) => { if (v && v.bestScore) best = v.bestScore; } };
  return { section:s,
           check:() => best >= rules.length ? { ok:true } : { ok:false, message:"Tick all five boxes (" + best + "/5)" },
           brief:{ eyebrow:"Challenge", title:stripTags(b.title) || "Password strength", text:b.task || "Invent a password that ticks all five boxes." } };
}

/* ---- CAESAR ---- */
function rCaesar(b){
  const s = el("section");
  s.appendChild(el("div","cipher-text", b.ciphertext));

  const row = el("div","shiftrow");
  const lbl = el("label","","Shift ");
  const shiftVal = el("b","","0");
  lbl.appendChild(shiftVal);
  const slider = el("input"); slider.type = "range"; slider.min = "0"; slider.max = "25"; slider.value = "0";
  row.appendChild(lbl); row.appendChild(slider);
  s.appendChild(row);

  const out = el("div","cipher-out");
  s.appendChild(out);

  function shiftBy(text, k){
    return text.replace(/[A-Za-z]/g, (c) => {
      const base = c === c.toUpperCase() ? 65 : 97;
      return String.fromCharCode(((c.charCodeAt(0) - base - k + 26) % 26) + base);
    });
  }
  function redraw(){ shiftVal.textContent = slider.value; out.textContent = shiftBy(b.ciphertext, parseInt(slider.value,10)); }
  slider.addEventListener("input", () => { redraw(); markDirty(); });
  redraw();

  const ans = el("input"); ans.type = "text"; ans.placeholder = "The message says…";
  ans.style.marginTop = "16px";
  s.appendChild(ans);
  const row2 = el("div","row no-print"); row2.style.marginTop = "14px";
  const btn = el("button","btn-primary","Check the message");
  const fb = el("div","feedback"); fb.hidden = true;
  row2.appendChild(btn);
  s.appendChild(row2); s.appendChild(fb);

  let solved = false;
  btn.addEventListener("click", () => {
    const ok = strHash(normLetters(ans.value)) === b.answerHash;
    solved = solved || ok;
    fb.hidden = false;
    fb.dataset.verdict = ok ? "correct" : "incorrect";
    fb.innerHTML = "<b></b><span></span>";
    fb.querySelector("b").textContent = ok ? "Code cracked" : "Not yet";
    fb.querySelector("span").textContent = ok
      ? "You found the shift and read the hidden message."
      : "Move the shift slider one step at a time. When the green text turns into real English words, copy it into the box.";
    markDirty();
  });
  ans.addEventListener("input", markDirty);

  fields[b.id] = {
    get:() => ({ shift:parseInt(slider.value,10), answer:ans.value, solved }),
    set:(v) => { if (!v) return; if (typeof v.shift === "number"){ slider.value = v.shift; redraw(); } if (v.answer) ans.value = v.answer; solved = !!v.solved; }
  };
  return { section:s,
           check:() => solved ? { ok:true } : { ok:false, message:"Crack the code and check the message" },
           brief:{ eyebrow:"Puzzle", title:stripTags(b.title) || "Caesar cipher", text:b.task || "Move the slider until the message makes sense." } };
}

/* ---------- Python via Pyodide ---------- */
let pyodide = null, pyLoading = null;
async function ensurePyodide(out){
  if (pyodide) return pyodide;
  if (!pyLoading){
    out.textContent = "Loading Python… (first run only)";
    pyLoading = new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
      sc.onload = res; sc.onerror = () => rej(new Error("Could not load Python."));
      document.head.appendChild(sc);
    }).then(() => loadPyodide({ indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.2/full/" }))
      .then((p) => { pyodide = p; return p; });
  }
  return pyLoading;
}
async function runPython(code, out, err){
  err.textContent = "";
  try{
    const py = await ensurePyodide(out);
    py.globals.set("_user_code", code);
    out.textContent = py.runPython(
      "import sys, io\n_buf = io.StringIO()\n_so, _se = sys.stdout, sys.stderr\n" +
      "sys.stdout = sys.stderr = _buf\ntry:\n    exec(compile(_user_code, '<student>', 'exec'), {})\n" +
      "except Exception:\n    import traceback; traceback.print_exc()\n" +
      "finally:\n    sys.stdout, sys.stderr = _so, _se\n_buf.getvalue()\n"
    ) || "(no output)";
  }catch(e){ out.textContent = ""; err.textContent = e.message || "Something went wrong running your code."; }
}

$("pdfBtn").addEventListener("click", () => { save(); window.print(); });
</script>
</body>
</html>
