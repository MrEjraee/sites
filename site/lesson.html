<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body class="lesson-page">
<header>
  <div class="bar">
    <div class="brand">
      <b id="lessonTitle">Lesson</b>
      <span><a href="index.html">&larr; All lessons</a></span>
    </div>
    <div class="auth">
      <span class="stepcount" id="stepCount"></span>
      <span class="chip" id="saveChip">Not saved yet</span>
      <button class="btn-ghost no-print" id="pdfBtn">Download as PDF</button>
    </div>
  </div>
  <div class="progress no-print"><div class="progress-bar" id="progressBar"></div></div>
</header>

<main>
  <div class="banner" id="signinBanner" hidden>
    You're not signed in, so your work <b>will not save</b>.
    <a href="index.html">Sign in on the home page</a> first, then come back.
  </div>

  <div id="blocks"></div>

  <nav class="stepnav no-print" id="stepNav">
    <button class="btn-ghost" id="backBtn">&larr; Back</button>
    <div class="navmid">
      <p class="lockmsg" id="lockMsg" aria-live="polite"></p>
    </div>
    <button class="btn-primary btn-big" id="nextBtn">Continue &rarr;</button>
  </nav>

  <div class="footnote no-print">
    <span id="bypassDot" role="button" tabindex="0" aria-label="Teacher options" title=" ">&#183;</span>
  </div>

  <p class="print-note">Printed from the Computing lesson hub — interactive activities are not shown on paper.</p>
</main>

<script>
const API = (window.HUB && window.HUB.WORKER_URL) || "";
const token = localStorage.getItem("hub_token") || "";
const $ = (id) => document.getElementById(id);
const lessonId = new URLSearchParams(location.search).get("id") || "demo";

const fields = {};        // id -> { get, set }
const steps  = [];        // { section, check() }
let step = 0;
let bypassed = false;
let lesson = null;

if (!token) $("signinBanner").hidden = false;

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function setChip(state){
  const c = $("saveChip");
  c.dataset.state = state;
  c.textContent = state==="saved" ? "Saved" : state==="saving" ? "Saving…" : state==="error" ? "Not saved" : "Not saved yet";
}
function strHash(s){ let x = 5381; for (const c of s) x = ((x << 5) + x + c.charCodeAt(0)) >>> 0; return x; }
function normLetters(s){ return (s || "").toUpperCase().replace(/[^A-Z]/g, ""); }
function wordCount(s){ return (s || "").trim().split(/\s+/).filter(Boolean).length; }

/* ---------- autosave: debounced, deduplicated, rate-limit friendly ---------- */
const AUTOSAVE_DELAY = 2500, MIN_GAP = 6000;
let saveTimer = null, lastSent = "", lastSaveAt = 0, saving = false;

function snapshot(){
  const data = { __step: step };
  Object.entries(fields).forEach(([id, f]) => { data[id] = f.get(); });
  return data;
}
function markDirty(){
  refreshGate();
  if (JSON.stringify(snapshot()) === lastSent) return;
  setChip("");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, Math.max(AUTOSAVE_DELAY, MIN_GAP - (Date.now() - lastSaveAt)));
}
async function save(){
  if (saving || !token || !API || API.indexOf("PASTE_") === 0) return;
  const payload = JSON.stringify(snapshot());
  if (payload === lastSent) return;
  saving = true; setChip("saving");
  try{
    const r = await fetch(API + "/api/save", {
      method:"POST",
      headers:{ "Content-Type":"application/json", Authorization:"Bearer " + token },
      body: JSON.stringify({ lesson: lessonId, data: JSON.parse(payload) })
    });
    if (!r.ok) throw new Error("save failed");
    lastSent = payload; lastSaveAt = Date.now(); setChip("saved");
  }catch(e){ setChip("error"); }
  saving = false;
}
window.addEventListener("pagehide", () => { clearTimeout(saveTimer); save(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });

/* ---------- load ---------- */
fetch("lessons/" + encodeURIComponent(lessonId) + ".json")
  .then(r => { if (!r.ok) throw new Error("missing"); return r.json().catch(() => { throw new Error("badjson"); }); })
  .then(async (l) => {
    lesson = l;
    document.title = l.title;
    $("lessonTitle").textContent = l.title;
    if (l.intro){
      const s = el("section","station intro-station");
      s.appendChild(el("p","lead", l.intro));
      $("blocks").appendChild(s);
    }
    l.blocks.forEach(renderBlock);
    if (token && API && API.indexOf("PASTE_")!==0) await loadSaved();
    showStep(step, true);
  })
  .catch((e) => {
    $("stepNav").hidden = true;
    $("blocks").innerHTML = e.message === "missing"
      ? '<p class="err">Could not find this lesson. Check the lesson id in the address bar.</p>'
      : e.message === "badjson"
      ? '<p class="err">This lesson file has a typo in it and could not be read.</p>'
      : '<p class="err">Something went wrong displaying this lesson. Please tell your teacher.</p>';
  });

async function loadSaved(){
  try{
    const r = await fetch(API + "/api/work?lesson=" + encodeURIComponent(lessonId), { headers: { Authorization: "Bearer " + token } });
    const d = await r.json();
    if (r.ok && d.data){
      Object.entries(d.data).forEach(([id, val]) => { if (fields[id]) fields[id].set(val); });
      if (typeof d.data.__step === "number") step = Math.min(Math.max(d.data.__step, 0), steps.length - 1);
      lastSent = JSON.stringify(snapshot());
      setChip("saved");
    }
  }catch(e){ /* offline — student can still work */ }
}

/* ---------- one activity per page ---------- */
function showStep(i, jump){
  step = Math.min(Math.max(i, 0), steps.length - 1);
  steps.forEach((s, n) => { s.section.hidden = (n !== step); });
  $("stepCount").textContent = "Step " + (step + 1) + " of " + steps.length;
  $("progressBar").style.width = (((step) / (steps.length - 1)) * 100) + "%";
  $("backBtn").disabled = step === 0;
  const last = step === steps.length - 1;
  $("nextBtn").textContent = last ? "Finish 🏁" : "Continue →";
  refreshGate();
  if (!jump) window.scrollTo({ top: 0, behavior: "smooth" });
}
function refreshGate(){
  const s = steps[step];
  if (!s) return;
  const res = bypassed ? { ok: true } : s.check();
  $("nextBtn").disabled = !res.ok;
  $("lockMsg").textContent = res.ok ? "" : (res.message || "Finish this activity to continue.");
  $("lockMsg").hidden = res.ok;
}
$("backBtn").addEventListener("click", () => showStep(step - 1));
$("nextBtn").addEventListener("click", () => {
  if (step === steps.length - 1){ save(); alert("Well done — you have finished the lesson. Your work is saved."); return; }
  showStep(step + 1);
});

/* ---------- bypass: a deliberately dull dot in the corner ---------- */
$("bypassDot").addEventListener("click", askBypass);
$("bypassDot").addEventListener("keydown", (e) => { if (e.key === "Enter") askBypass(); });
function askBypass(){
  const code = prompt("Enter code:");
  if (code === null) return;
  const wanted = (lesson && lesson.bypassHash) || 2667650483; // default code: SKIP-2026
  if (strHash(code.trim()) === wanted){
    bypassed = true;
    document.body.classList.add("bypassed");
    refreshGate();
    alert("Skipping unlocked for this lesson. You can now move between all activities freely.");
  } else {
    alert("That code is not right.");
  }
}

/* ---------- renderers: each returns { section, check } ---------- */
function renderBlock(b, i){
  const R = { text:rText, question:rQuestion, python:rPython, embed:rEmbed, link:rLink,
              quiz:rQuiz, password:rPassword, caesar:rCaesar }[b.type];
  if (!R){ console.warn("Unknown block type:", b.type); return; }
  let built;
  try { built = R(b); }
  catch (err){
    console.error("Block " + (i+1) + " (" + b.type + ") failed:", err);
    const s = el("section","station");
    s.appendChild(el("p","err","This activity could not be displayed. Continue and tell your teacher."));
    built = { section: s, check: () => ({ ok: true }) };
  }
  built.section.hidden = true;
  $("blocks").appendChild(built.section);
  steps.push(built);
}

function rText(b){
  const s = el("section","station");
  s.appendChild(el("div","prose", b.html));
  return { section: s, check: () => ({ ok: true }) };
}

function rEmbed(b){
  const s = el("section","station");
  if (b.title) s.appendChild(el("h2","step-title", b.title));
  if (b.note) s.appendChild(el("p","lead", b.note));
  const f = el("iframe","embed"); f.src = b.url; f.height = b.height || 460;
  f.setAttribute("allowfullscreen",""); f.title = b.title || "Embedded activity";
  s.appendChild(f);

  const done = el("label","confirm");
  const cb = el("input"); cb.type = "checkbox";
  cb.addEventListener("change", markDirty);
  done.appendChild(cb);
  done.appendChild(el("span","","I have watched the whole video"));
  s.appendChild(done);

  if (b.id) fields[b.id] = { get: () => cb.checked, set: (v) => { cb.checked = !!v; } };
  return { section: s, check: () => cb.checked ? { ok: true } : { ok: false, message: "Watch the video, then tick the box to continue." } };
}

function rQuestion(b){
  const s = el("section","station");
  s.appendChild(el("h2","step-title","Your answer"));
  s.appendChild(el("p","lead", b.prompt));
  const min = b.minWords || 8;
  const ta = el("textarea"); ta.rows = 5; ta.placeholder = "Type your answer here…";
  const counter = el("p","counter");
  function tick(){
    const n = wordCount(ta.value);
    counter.textContent = n + " word" + (n===1?"":"s") + (n < min ? " — write at least " + min : " ✓");
    counter.dataset.ok = n >= min;
  }
  ta.addEventListener("input", () => { tick(); markDirty(); });
  fields[b.id] = { get: () => ta.value, set: (v) => { ta.value = v || ""; tick(); } };
  s.appendChild(ta); s.appendChild(counter); tick();
  return { section: s, check: () => wordCount(ta.value) >= min
    ? { ok: true } : { ok: false, message: "Write at least " + min + " words to continue." } };
}

function rLink(b){
  const s = el("section","station");
  s.appendChild(el("h2","step-title", b.prompt || "Paste your link"));
  if (b.note) s.appendChild(el("p","lead", b.note));
  const inp = el("input"); inp.type = "text"; inp.placeholder = "https://…";
  inp.addEventListener("input", markDirty);
  fields[b.id] = { get: () => inp.value, set: (v) => { inp.value = v || ""; } };
  s.appendChild(inp);
  return { section: s, check: () => /^https?:\/\/\S+\.\S+/.test(inp.value.trim())
    ? { ok: true } : { ok: false, message: "Paste a link starting with https:// to continue." } };
}

function rPython(b){
  const s = el("section","station");
  s.appendChild(el("h2","step-title","Python"));
  if (b.task) s.appendChild(el("p","lead", b.task));
  const ta = el("textarea","code"); ta.spellcheck = false; ta.value = b.starter || "";
  ta.addEventListener("input", markDirty);
  fields[b.id] = { get: () => ta.value, set: (v) => { if (v) ta.value = v; } };
  s.appendChild(ta);
  const row = el("div","row no-print");
  const run = el("button","btn-primary","Run"); const err = el("span","err");
  const out = el("div","output"); out.setAttribute("aria-live","polite");
  let ran = false;
  run.addEventListener("click", async () => { await runPython(ta.value, out, err); ran = true; markDirty(); });
  row.appendChild(run); row.appendChild(err);
  s.appendChild(row); s.appendChild(out);
  return { section: s, check: () => ran ? { ok: true } : { ok: false, message: "Press Run at least once to continue." } };
}

/* ---- QUIZ: self-marking, must get every question right (retries allowed) ---- */
function rQuiz(b){
  const s = el("section","station");
  if (b.title) s.appendChild(el("h2","step-title", b.title));
  if (b.note) s.appendChild(el("p","lead", b.note));
  const chosen = new Array(b.questions.length).fill(null);
  const groups = [];

  b.questions.forEach((q, i) => {
    const wrap = el("div","quizq");
    wrap.appendChild(el("div","quizq-text", "<b>Question " + (i+1) + "</b><br>" + q.q));
    const opts = el("div","opts");
    q.options.forEach((opt, j) => {
      const lab = el("label","opt");
      const radio = el("input"); radio.type = "radio"; radio.name = b.id + "-" + i;
      radio.addEventListener("change", () => { chosen[i] = j; markDirty(); });
      lab.appendChild(radio); lab.appendChild(el("span","", opt));
      opts.appendChild(lab);
    });
    wrap.appendChild(opts);
    const fb = el("div","feedback"); fb.hidden = true;
    wrap.appendChild(fb);
    groups.push({ wrap, fb, opts });
    s.appendChild(wrap);
  });

  const row = el("div","row no-print");
  const btn = el("button","btn-primary","Check my answers");
  const score = el("span","chip");
  row.appendChild(btn); row.appendChild(score);
  s.appendChild(row);

  let checked = false;
  function allRight(){ return chosen.every((c, i) => c === b.questions[i].answer); }
  function mark(){
    checked = true;
    let right = 0;
    b.questions.forEach((q, i) => {
      const g = groups[i];
      if (chosen[i] === null){ g.fb.hidden = true; return; }
      const ok = chosen[i] === q.answer;
      if (ok) right++;
      g.fb.hidden = false;
      g.fb.dataset.verdict = ok ? "correct" : "incorrect";
      g.fb.innerHTML = "<b></b><span></span>";
      g.fb.querySelector("b").textContent = ok ? "Correct" : "Not quite — try again";
      g.fb.querySelector("span").textContent = ok ? (q.why || "") : (q.hint || "Read the question once more and pick another answer.");
    });
    const answered = chosen.filter(c => c !== null).length;
    score.dataset.state = allRight() ? "saved" : "";
    score.textContent = "Score: " + right + " / " + b.questions.length + (answered < b.questions.length ? " (some unanswered)" : "");
    markDirty();
  }
  btn.addEventListener("click", mark);

  fields[b.id] = {
    get: () => ({ chosen, score: chosen.reduce((n, c, i) => n + (c === b.questions[i].answer ? 1 : 0), 0), outOf: b.questions.length }),
    set: (v) => {
      if (!v || !Array.isArray(v.chosen)) return;
      v.chosen.forEach((c, i) => {
        if (c === null || c === undefined) return;
        chosen[i] = c;
        const r = groups[i].opts.querySelectorAll("input")[c];
        if (r) r.checked = true;
      });
      mark();
    }
  };
  return { section: s, check: () => allRight()
    ? { ok: true }
    : { ok: false, message: checked ? "Fix the answers marked in red, then check again." : "Answer every question and press Check my answers." } };
}

/* ---- PASSWORD: nothing typed here is ever saved or sent ---- */
const COMMON_PW = ["password","123456","12345678","qwerty","abc123","letmein","monkey","football","iloveyou","admin","welcome","dragon","sunshine","princess","password1","liverpool","arsenal","chelsea","minecraft","fortnite"];
function rPassword(b){
  const s = el("section","station");
  if (b.title) s.appendChild(el("h2","step-title", b.title));
  if (b.task) s.appendChild(el("p","lead", b.task));
  s.appendChild(el("p","warnline","🔒 Test made-up passwords only — never a real one. Nothing you type here is sent anywhere or saved."));

  const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.placeholder = "Try a password…";
  s.appendChild(inp);
  const meter = el("div","meter"); const bar = el("div","meter-bar"); meter.appendChild(bar); s.appendChild(meter);
  const verdict = el("div","pw-verdict"); s.appendChild(verdict);
  const checks = el("ul","pw-checks"); s.appendChild(checks);

  let best = 0;
  const rules = [
    { label: "At least 12 characters long", test: (p) => p.length >= 12 },
    { label: "Has capital letters and small letters", test: (p) => /[a-z]/.test(p) && /[A-Z]/.test(p) },
    { label: "Has at least one number", test: (p) => /[0-9]/.test(p) },
    { label: "Has a symbol, like ! ? # or £", test: (p) => /[^A-Za-z0-9]/.test(p) },
    { label: "Is not a common or guessable password", test: (p) => p.length > 0 && !COMMON_PW.some(c => p.toLowerCase().includes(c)) },
  ];
  function update(){
    const p = inp.value;
    const passed = rules.map(r => r.test(p));
    const n = passed.filter(Boolean).length;
    checks.innerHTML = "";
    rules.forEach((r, i) => {
      const li = el("li", passed[i] ? "pass" : "fail");
      li.textContent = (passed[i] ? "✓ " : "✗ ") + r.label;
      checks.appendChild(li);
    });
    bar.style.width = (p ? (n / rules.length) * 100 : 0) + "%";
    bar.dataset.level = n <= 2 ? "weak" : n <= 4 ? "ok" : "strong";
    verdict.textContent = !p ? "" : n <= 2 ? "Weak — a hacker's computer could guess this very quickly." :
                          n <= 4 ? "Getting better — keep going." : "Strong — well done!";
    if (n > best){ best = n; }
    markDirty();
  }
  inp.addEventListener("input", update);
  fields[b.id] = { get: () => ({ bestScore: best, outOf: rules.length }), set: (v) => { if (v && v.bestScore) best = v.bestScore; } };
  return { section: s, check: () => best >= rules.length
    ? { ok: true } : { ok: false, message: "Make a password that ticks all five boxes to continue." } };
}

/* ---- CAESAR: plaintext stored only as a hash ---- */
function rCaesar(b){
  const s = el("section","station");
  if (b.title) s.appendChild(el("h2","step-title", b.title));
  if (b.task) s.appendChild(el("p","lead", b.task));
  s.appendChild(el("div","cipher-text", b.ciphertext));

  const row = el("div","row no-print");
  const lbl = el("label","","Shift: ");
  const shiftVal = el("b","","0");
  lbl.appendChild(shiftVal); lbl.style.margin = "0";
  const slider = el("input"); slider.type = "range"; slider.min = "0"; slider.max = "25"; slider.value = "0";
  row.appendChild(lbl); row.appendChild(slider);
  s.appendChild(row);

  const out = el("div","cipher-out");
  s.appendChild(out);

  function shiftBy(text, k){
    return text.replace(/[A-Za-z]/g, (c) => {
      const base = c === c.toUpperCase() ? 65 : 97;
      return String.fromCharCode(((c.charCodeAt(0) - base - k + 26) % 26) + base);
    });
  }
  function redraw(){
    const k = parseInt(slider.value, 10);
    shiftVal.textContent = k;
    out.textContent = shiftBy(b.ciphertext, k);
  }
  slider.addEventListener("input", () => { redraw(); markDirty(); });
  redraw();

  s.appendChild(el("label","big-label", b.prompt || "Type the secret message here:"));
  const ans = el("input"); ans.type = "text"; ans.placeholder = "The message says…";
  s.appendChild(ans);

  const row2 = el("div","row no-print");
  const btn = el("button","btn-primary","Check the message");
  const fb = el("div","feedback"); fb.hidden = true;
  row2.appendChild(btn);
  s.appendChild(row2); s.appendChild(fb);

  let solved = false;
  btn.addEventListener("click", () => {
    const ok = strHash(normLetters(ans.value)) === b.answerHash;
    solved = solved || ok;
    fb.hidden = false;
    fb.dataset.verdict = ok ? "correct" : "incorrect";
    fb.innerHTML = "<b></b><span></span>";
    fb.querySelector("b").textContent = ok ? "Code cracked!" : "Not yet";
    fb.querySelector("span").textContent = ok
      ? "Brilliant — you found the shift and read the hidden message."
      : "Move the shift slider one step at a time and read the green text underneath. When it turns into real English words, copy it into the box.";
    markDirty();
  });
  ans.addEventListener("input", markDirty);

  fields[b.id] = {
    get: () => ({ shift: parseInt(slider.value, 10), answer: ans.value, solved }),
    set: (v) => {
      if (!v) return;
      if (typeof v.shift === "number"){ slider.value = v.shift; redraw(); }
      if (v.answer) ans.value = v.answer;
      solved = !!v.solved;
    }
  };
  return { section: s, check: () => solved
    ? { ok: true } : { ok: false, message: "Crack the code and check the message to continue." } };
}

/* ---------- Python via Pyodide ---------- */
let pyodide = null, pyLoading = null;
async function ensurePyodide(out){
  if (pyodide) return pyodide;
  if (!pyLoading){
    out.textContent = "Loading Python… (first run only)";
    pyLoading = new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
      sc.onload = res; sc.onerror = () => rej(new Error("Could not load Python."));
      document.head.appendChild(sc);
    }).then(() => loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/" }))
      .then((p) => { pyodide = p; return p; });
  }
  return pyLoading;
}
async function runPython(code, out, err){
  err.textContent = "";
  try{
    const py = await ensurePyodide(out);
    py.globals.set("_user_code", code);
    out.textContent = py.runPython(
      "import sys, io\n_buf = io.StringIO()\n_so, _se = sys.stdout, sys.stderr\n" +
      "sys.stdout = sys.stderr = _buf\ntry:\n    exec(compile(_user_code, '<student>', 'exec'), {})\n" +
      "except Exception:\n    import traceback; traceback.print_exc()\n" +
      "finally:\n    sys.stdout, sys.stderr = _so, _se\n_buf.getvalue()\n"
    ) || "(no output)";
  }catch(e){
    out.textContent = "";
    err.textContent = e.message || "Something went wrong running your code.";
  }
}

$("pdfBtn").addEventListener("click", () => { save(); document.body.classList.add("printing"); window.print(); setTimeout(() => document.body.classList.remove("printing"), 500); });
</script>
</body>
</html>
